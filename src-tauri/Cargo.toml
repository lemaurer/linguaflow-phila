[package]
name = "linguaflow-prototype"
version = "0.1.0"
description = "A desktop UI prototype for LinguaFlow"
authors = ["LinguaFlow"]
edition = "2021"

[lib]
name = "linguaflow_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
